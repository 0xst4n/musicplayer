<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Musicplayer">
  <title>Musicplayer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><img src="/icons/icon-192.png" alt=""><span>Musicplayer</span></div>
      <nav class="side-nav">
        <a href="#/library" data-nav="library"><svg class="i"><use href="#i-library"/></svg>Your Library</a>
        <a href="#/import" data-nav="import"><svg class="i"><use href="#i-import"/></svg>Import<span class="badge" id="import-badge" hidden></span></a>
      </nav>
      <div class="side-library">
        <div class="side-library-head">
          <span><svg class="i"><use href="#i-library"/></svg>Your playlists</span>
          <button class="icon-btn" data-action="new-playlist" title="Create playlist"><svg class="i"><use href="#i-plus"/></svg></button>
        </div>
        <div id="side-playlists" class="side-playlists"></div>
      </div>
    </aside>

    <main id="main">
      <div id="offline-banner" hidden>Can't reach the Musicplayer server. Only downloaded songs can be played until it's back.</div>
      <div id="view"></div>
    </main>

    <footer id="player">
      <div class="np" data-action="open-nowplaying">
        <div class="np-cover cover" id="np-cover"></div>
        <div class="np-text">
          <div class="np-title" id="np-title"></div>
          <div class="np-artist" id="np-artist"></div>
        </div>
      </div>
      <div class="controls">
        <div class="buttons">
          <button class="icon-btn toggle" data-action="shuffle" title="Shuffle (S)"><svg class="i"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" data-action="prev" title="Previous (Ctrl+←)"><svg class="i"><use href="#i-prev"/></svg></button>
          <button class="play-btn" data-action="toggle" title="Play / pause (Space)"><svg class="i"><use href="#i-play"/></svg></button>
          <button class="icon-btn" data-action="next" title="Next (Ctrl+→)"><svg class="i"><use href="#i-next"/></svg></button>
          <button class="icon-btn toggle" data-action="repeat" title="Repeat (R)"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="seek">
          <span class="time" id="t-cur">0:00</span>
          <input type="range" class="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span class="time" id="t-dur">0:00</span>
        </div>
      </div>
      <div class="volume">
        <button class="icon-btn" data-action="mute" title="Mute (M)"><svg class="i"><use href="#i-volume"/></svg></button>
        <input type="range" class="range" id="volume" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <div class="mini-progress"><div id="mini-progress-fill"></div></div>
      <button class="icon-btn mini-play" data-action="toggle" aria-label="Play / pause"><svg class="i"><use href="#i-play"/></svg></button>
    </footer>

    <nav id="tabbar">
      <a href="#/library" data-nav="library"><svg class="i"><use href="#i-library"/></svg><span>Library</span></a>
      <a href="#/import" data-nav="import"><svg class="i"><use href="#i-import"/></svg><span>Import</span></a>
    </nav>
  </div>

  <!-- Mobile full-screen player -->
  <section id="nowplaying" hidden>
    <div class="fs-bg" id="fs-bg"></div>
    <header class="fs-head">
      <button class="icon-btn" data-action="close-nowplaying" aria-label="Close"><svg class="i"><use href="#i-down"/></svg></button>
      <div class="fs-context" id="fs-context"></div>
      <span style="width:40px"></span>
    </header>
    <div class="fs-cover cover" id="fs-cover"></div>
    <div class="fs-meta">
      <div class="fs-title" id="fs-title"></div>
      <div class="fs-artist" id="fs-artist"></div>
    </div>
    <div class="fs-seek">
      <input type="range" class="range" id="fs-seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="fs-times"><span id="fs-cur">0:00</span><span id="fs-dur">0:00</span></div>
    </div>
    <div class="fs-buttons">
      <button class="icon-btn toggle" data-action="shuffle" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn big" data-action="prev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="play-btn huge" data-action="toggle" aria-label="Play / pause"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon-btn big" data-action="next" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="icon-btn toggle" data-action="repeat" aria-label="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
  </section>

  <div id="menu" class="menu" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="auto"></audio>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15a1 1 0 0 0 1.52.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path fill="currentColor" d="M5 5.2v13.6a.8.8 0 0 0 1.25.66L16 12.66V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v5.34L6.25 4.54A.8.8 0 0 0 5 5.2z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path fill="currentColor" d="M19 5.2v13.6a.8.8 0 0 1-1.25.66L8 12.66V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5.34l9.75-6.8A.8.8 0 0 1 19 5.2z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 6h3.5c2 0 3.2 1 4.3 2.8l2.4 4.4C14.3 15 15.5 18 17.5 18H21m0 0-2.5-2.5M21 18l-2.5 2.5M3 18h3.5c1.4 0 2.4-.6 3.2-1.6M21 6h-3.5c-1.4 0-2.4.6-3.2 1.6M21 6l-2.5-2.5M21 6l-2.5 2.5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 2.5 20 5.5l-3 3M4 11.5V10a4.5 4.5 0 0 1 4.5-4.5H20M7 21.5l-3-3 3-3M20 12.5V14a4.5 4.5 0 0 1-4.5 4.5H4"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17 2.5 20 5.5l-3 3M4 11.5V10a4.5 4.5 0 0 1 4.5-4.5H20M7 21.5l-3-3 3-3M20 12.5V14a4.5 4.5 0 0 1-4.5 4.5H4"/><path fill="currentColor" d="M11 10h2v6h-1.6v-4.1l-.9.5-.6-1.3z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m16 9 6 6m0-6-6 6"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path fill="currentColor" d="M20 3v12.5a3.5 3.5 0 1 1-2-3.16V7.1l-8 1.6v8.8A3.5 3.5 0 1 1 8 14.34V5.2z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 3v18M10 3v18M15 4l5 16.5"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9a2.83 2.83 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 7v9m0 0-3.5-3.5M12 16l3.5-3.5"/></symbol>
    <symbol id="i-downloaded" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 6.5v10m0 0-4-4m4 4 4-4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 7v5l3 2"/></symbol>
  </svg>

  <script type="module" src="/app.js"></script>
</body>
</html>
